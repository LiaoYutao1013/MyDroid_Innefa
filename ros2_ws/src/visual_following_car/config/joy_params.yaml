joy_node:
  ros__parameters:
    # ════════════════════════════════════════
    # Joy节点参数配置
    # ════════════════════════════════════════

    device_id: 0                    # 蓝牙手柄设备ID
                                     # 如有多个手柄，0为第一个，1为第二个，以此类推
                                     # 查看: ls /dev/input/js*

    deadzone: 0.1                   # 摇杆死区 (0.0 ~ 1.0)
                                     # 数值越大，中心无反应区域越大
                                     # 用于防止摇杆漂移

    autorepeat_rate: 20.0           # 消息发布频率 (Hz)
                                     # 值越大，发布消息越频繁
                                     # 建议范围：20-50 Hz
                                     # 蓝牙手柄通常20Hz足够

    coalesce_interval_ms: 20        # 消息合并间隔 (毫秒)
                                     # 如果两个事件间隔小于此值，会合并成一个消息
                                     # 用于减少消息量

    default_trig_val: false         # 触发器默认值
                                     # false: 使用实际值 (通常 0.0 ~ 1.0)
                                     # true: 使用标准化值 (-1.0 ~ 1.0)

    # 以下两个参数通常不需要修改
    # (除非Joy节点自动检测错误)

    dev: ""                         # 设备路径 (留空自动检测)
                                     # 或指定如: /dev/input/js0

    # ════════════════════════════════════════
    # 常见问题和调整
    # ════════════════════════════════════════
    # Q: 摇杆移起就有输出，太灵敏了
    # A: 增加 deadzone 值，例如改为 0.15 ~ 0.2
    #
    # Q: 同样的操作，有时有输出有时没有
    # A: 增加 coalesce_interval_ms，例如改为 30 ~ 50
    #
    # Q: 输入不起作用
    # A: 检查 device_id 是否正确 (ls /dev/input/js*)
    #    或检查 bluetooth_gamepad_node 是否设置了正确的映射
    #
    # Q: 微微晃动摇杆就产生运动
    # A: 这是正常的！可通过增加 deadzone 来改善
    # ════════════════════════════════════════
