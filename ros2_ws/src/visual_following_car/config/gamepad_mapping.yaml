# Radxa ROCK 3B + 雷神蓝牙手柄 的按键映射配置
#
# 使用步骤：
# 1. 运行 python3 detect_gamepad_mapping.py 检测你的手柄
# 2. 根据检测结果修改下列按键和轴的索引
# 3. 保存此文件，重启节点

gamepad_mapping:
  # ════════════════════════════════════════
  # 按键映射 (buttons数组的索引)
  # ════════════════════════════════════════
  buttons:
    # 标准游戏按键 (A/B/X/Y)
    A:          0        # 蓝键 (通常X/Cross)
    B:          1        # 红键 (通常O/Circle)
    X:          2        # 黄键 (通常□/Square)
    Y:          3        # 绿键 (通常△/Triangle)

    # 肩部按键
    LB:         4        # 左肩按键 (LB/L1)
    RB:         5        # 右肩按键 (RB/R1)

    # 中央按键
    back:       6        # 返回/选择按键
    start:      7        # 开始按键

    # 摇杆点击
    left_stick:  8       # 左摇杆按下
    right_stick: 9       # 右摇杆按下

    # HOME/指南按键
    guide:      10       # HOME/PS/指南按键

  # ════════════════════════════════════════
  # 轴映射 (axes数组的索引)
  # ════════════════════════════════════════
  axes:
    # 左摇杆
    left_stick_x:  0     # 左摇杆X轴 (左-1.0 ~ 右+1.0)
    left_stick_y:  1     # 左摇杆Y轴 (上-1.0 ~ 下+1.0)

    # 触发器
    left_trigger:  2     # 左触发器 (未按0.0 ~ 按下1.0，某些手柄是-1.0 ~ 1.0)

    # 右摇杆
    right_stick_x: 3     # 右摇杆X轴 (左-1.0 ~ 右+1.0)
    right_stick_y: 4     # 右摇杆Y轴 (上-1.0 ~ 下+1.0)

    # 右触发器
    right_trigger: 5     # 右触发器 (未按0.0 ~ 按下1.0，某些手柄是-1.0 ~ 1.0)

    # D-Pad (方向键)
    dpad_x:        6     # D-Pad X轴 (左-1.0 ~ 右+1.0)
    dpad_y:        7     # D-Pad Y轴 (上-1.0 ~ 下+1.0)

  # ════════════════════════════════════════
  # 控制功能映射
  # ════════════════════════════════════════
  controls:
    # 底盘运动 (使用左摇杆的默认配置)
    forward:     "left_stick_y"   # 前进/后退 (按上为前进)
    strafe:      "left_stick_x"   # 左平移/右平移 (按左为左移)
    rotate:      "right_stick_x"  # 原地旋转 (按左为逆时针)

    # 云台控制 (使用方向键D-Pad)
    gimbal_pan:  "dpad_x"         # 云台左右转 (←左 →右)
    gimbal_tilt: "dpad_y"         # 云台上下转 (↑上 ↓下)

    # 功能按键
    enable_follow:   "start"      # 按下启动自动跟随
    disable_follow:  "back"       # 按下关闭自动跟随
    estop:          "Y"           # 紧急停止 (Y键)

# ════════════════════════════════════════
# 注意：
# - 如果你的手柄映射不符合上述预设，请运行：
#   python3 detect_gamepad_mapping.py
#   该工具会引导你逐一识别每个按键和轴
#
# - 轴值范围通常是 -1.0 ~ 1.0
#   负值表示左/上，正值表示右/下
#
# - 触发器在不同手柄上的表现不同：
#   Xbox手柄：LT 未按0 ~ 按下1
#   PS手柄：L2 未按-1 ~ 按下1
#   雷神手柄：具体值见检测结果
#
# - 死区默认值 0.1 可在启动参数中调整
# ════════════════════════════════════════
